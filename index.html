<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js" type="text/javascript"></script>
    <style>
      /* 讓輸入框隱藏，但仍可被選取 */
      #clipboard-input {
        position: absolute;
        left: -9999px;
      }
      button {
        background-color: #688FC1; /* 背景顏色藍色 */
        color: white; /* 文字顏色白色 */
        height: 50px; /* 高度設置為20px */
        width: 100px; /* 設置按鈕寬度為150px */
        border: none; /* 去掉邊框 */
        border-radius: 15px; /* 添加圓角效果 */
        cursor: pointer; /* 鼠標懸停時顯示為點擊狀態 */
      }
    </style>
  </head>
  <body>
    <textarea id="clipboard-input"></textarea>

    <button id="copy-button">Copy</button>

    <p id="status"></p>

    <script type="text/javascript">
      const inputField = document.getElementById("clipboard-input");
      const copyButton = document.getElementById("copy-button");
      const statusText = document.getElementById("status");
      let textToCopy = ""; 
    
      function copyText() {
        if (textToCopy) {
          inputField.value = textToCopy;
          inputField.select(); 
          inputField.setSelectionRange(0, 99999); 
          
          try {
            document.execCommand("copy");
            statusText.textContent = "Copied!"; // 建議加上提示讓使用者知道成功了
          } catch (err) {
            statusText.textContent = "Error";
            console.error('Copy failed: ', err);
          }
        }
      }
    
      copyButton.addEventListener('click', copyText);
    
      // --- 修改重點在此 ---
      ThunkableWebviewerExtension.receiveMessage(function(message) {
        if (message) {
          // 使用正規表達式將字面上的 \n 替換成真正的換行符
          // /\\n/g 代表尋找所有的「反斜線+n」
          textToCopy = message.replace(/\\n/g, '\n'); 
        }
        statusText.textContent = "";
      });
    </script>
  </body>
</html>
