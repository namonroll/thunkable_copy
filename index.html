<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://thunkable.github.io/webviewer-extension/thunkableWebviewerExtension.js" type="text/javascript"></script>
    <style>
      /* 讓輸入框隱藏，但仍可被選取 */
      #clipboard-input {
        position: absolute;
        left: -9999px;
      }
      button {
        background-color: #688FC1; /* 背景顏色藍色 */
        color: white; /* 文字顏色白色 */
        height: 50px; /* 高度設置為20px */
        width: 100px; /* 設置按鈕寬度為150px */
        border: none; /* 去掉邊框 */
        border-radius: 15px; /* 添加圓角效果 */
        cursor: pointer; /* 鼠標懸停時顯示為點擊狀態 */
      }
    </style>
  </head>
  <body>
    <textarea id="clipboard-input"></textarea>

    <button id="copy-button">Copy</button>

    <p id="status"></p>

    <script type="text/javascript">
      const inputField = document.getElementById("clipboard-input");
      const copyButton = document.getElementById("copy-button");
      const statusText = document.getElementById("status");
      let textToCopy = "";
    
      function copyText() {
        if (!textToCopy) {
          statusText.textContent = "尚未接收到文字";
          return;
        }
    
        // 將處理好的換行文字放入隱藏的 textarea
        inputField.value = textToCopy;
        
        // 選取並執行複製
        inputField.select();
        inputField.setSelectionRange(0, 99999); // 確保手機端也能全選
    
        try {
          const successful = document.execCommand("copy");
          statusText.textContent = successful ? "" : "";
        } catch (err) {
          statusText.textContent = "瀏覽器不支援複製功能";
        }
      }
    
      copyButton.addEventListener('click', copyText);
    
      // --- 關鍵修正：處理傳入的字串 ---
      ThunkableWebviewerExtension.receiveMessage(function(message) {
        if (message) {
          // 步驟：先將字串中的 "\\n" (字面上的文字) 替換成 "\n" (真正的換行符號)
          // 使用 split + join 是最安全的方法，不會被正則表達式的特殊符號干擾
          textToCopy = message.split('\\n').join('\n');
          
          statusText.textContent = "";
        }
      });
    </script>
  </body>
</html>
